# Concept thesaurus for discover() (roadmap stage D, docs/discovery.md).
#
# Everyday and practitioners' words → the vocabulary statutes use. Query expansion only:
# an expansion is searched at a lower weight than the word typed, and never replaces it.
# Keys are single words; expansions may be phrases. Compiled into data/concepts/thesaurus.json
# by ingest.build_concept_index (stemmed, like every indexed term).
#
# Seeded from general legal usage on 29 Sept 2026, not from any battery query. Additions
# may only come from failures on the concept battery's dev slice (roadmap D2); never from
# the test slice.

