[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "legal-rag-router"
version = "0.1.0.dev0"
description = "Deterministic coordinate pre-routing and epistemic abstention for legal RAG"
readme = "README.md"
authors = [{ name = "Memon Systems", email = "abdullah@memonsystems.com" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["legal", "rag", "retrieval", "citation", "legislation", "router"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/azterizm/legal-rag-router"
Repository = "https://github.com/azterizm/legal-rag-router"
Issues = "https://github.com/azterizm/legal-rag-router/issues"
Changelog = "https://github.com/azterizm/legal-rag-router/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "pydantic>=2.8",
    "types-defusedxml>=0.7.0.20260504",
]
ingest = [
    "httpx>=0.28",
    "defusedxml>=0.7.1",
    "pydantic>=2.8",
]
eval = ["pydantic>=2.8"]
bench = ["httpx>=0.28"]

[tool.uv]
default-groups = ["dev", "ingest", "eval"]

# ---------------------------------------------------------------- build
[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag_router"]

[tool.hatch.build.targets.sdist]
include = [
    "src/legal_rag_router",
    "tests",
    "scripts",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "SECURITY.md",
    "data/MANIFEST.json",
    "pyproject.toml",
]

# ---------------------------------------------------------------- lint / format
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
extend-exclude = ["uk_scrap_data"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT", "N",
    "S", "BLE", "A", "T20", "ISC", "PIE", "RET", "PTH", "TRY", "PERF", "FBT",
]
ignore = [
    "PLR0913",  # grammar/resolver functions legitimately take many parameters
    "TRY003",   # contextual messages on raised exceptions are wanted
    "ISC001",   # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "FBT", "S311"]
"scripts/**" = ["T20"]
"ingest/**" = ["T20"]
"bench/**" = ["T20", "S311"]
"eval/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["legal_rag_router", "ingest", "eval", "bench"]

# ---------------------------------------------------------------- types
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = "src"
files = ["src", "tests", "scripts", "ingest", "eval", "bench"]
exclude = ["^uk_scrap_data/"]


# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "full_data: needs the full local corpus under data/ (skipped in CI)",
]

[tool.coverage.run]
source = ["legal_rag_router"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
