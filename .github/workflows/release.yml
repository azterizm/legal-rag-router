name: Release

# Triggered by pushing a version tag (v0.1.0). Before the tag is pushed, a draft GitHub release
# for it must already hold the index assets: index-*.tar.gz, concepts-*.tar.gz, NOTICE and
# SHA256SUMS (scripts/package_index.py). The index is built on the maintainer's machine from
# data that is never committed, so CI cannot build it. This workflow then checks the draft,
# builds and checks the wheel, publishes to PyPI through the Trusted Publisher (with PEP 740
# attestations), adds the wheel and sdist to the release and publishes it.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  preflight:
    name: Check the version and the draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write # read a draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: The draft release holds the index assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --json assets -q '.assets[].name')
          for pattern in '^index-.*\.tar\.gz$' '^concepts-.*\.tar\.gz$' '^NOTICE$' '^SHA256SUMS$'; do
            echo "${assets}" | grep -q -E "${pattern}" || { echo "missing release asset ${pattern}"; exit 1; }
          done

  build:
    name: Build and check
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check && uv run ruff format --check && uv run mypy
      - run: uv run pytest --cov
        env:
          LRR_LATENCY_BUDGET_MS: "25"
      - run: uv build
      - run: uv run --no-project python scripts/check_wheel.py dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/legal-rag-router
    permissions:
      id-token: write # Trusted Publisher and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: Publish the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Add the wheel and sdist, then publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/* -R "${GITHUB_REPOSITORY}"
          gh release edit "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --draft=false --latest
